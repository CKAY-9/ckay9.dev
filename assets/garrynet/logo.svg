<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="GarryNet">
  <defs>
    <clipPath id="tile">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
    <pattern id="net" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45 32 32) translate(-4 -4)">
      <path d="M0 0H16M0 0V16" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity=".55"/>
      <circle cx="0" cy="0" r="2" fill="#60a5fa"/>
    </pattern>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#0f1115"/>
    <rect width="64" height="64" fill="url(#net)"/>
  </g>

  <!-- G: dark outline knocks the net out behind the letter, then the letter on top -->
  <path d="M42.6 21.4A15 15 0 1 0 47 32H33" fill="none" stroke="#0f1115" stroke-width="13" stroke-linejoin="round"/>
  <path d="M42.6 21.4A15 15 0 1 0 47 32H33" fill="none" stroke="#e6e8ec" stroke-width="7"/>
</svg>
