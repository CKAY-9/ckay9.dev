<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CKAY9.dev</title>
    <meta name="description"
        content="Web and Systems Developer from Vancouver, BC. Experience in a wide variety of tools (Git, Docker), programming languages (TypeScript, Rust, Java, Python), platforms (AWS, Vercel), etc." />
    <link rel="icon" type="image/x-icon" href="https://avatars.githubusercontent.com/u/53030585?v=4" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
</head>

<body>
    <!-- Project icon backdrop: two layers so switching projects crossfades instead of swapping -->
    <div class="bg-tiles" aria-hidden="true"><div class="bg-tiles-pan"></div></div>
    <div class="bg-tiles" aria-hidden="true"><div class="bg-tiles-pan"></div></div>

    <div class="container" id="container">
        <section class="content">
            <!-- Home -->
            <div class="view" id="home-view">
                <img src="https://avatars.githubusercontent.com/u/53030585?v=4" alt="GitHub Profile Picture"
                    class="icon" id="home-avatar" />
                <h1>CKAY9.dev</h1>
                <h2>Cameron Armstrong</h2>
                <span>Hey, I work on web and game development, but also love tinkering and CAD</span>
                <div class="links">
                    <a href="https://github.com/CKAY-9">GitHub</a>
                    <a href="#projects">Projects</a>
                </div>
            </div>

            <!-- Projects -->
            <div class="view" id="projects-view" hidden>
                <header class="projects-header">
                    <a href="./" class="home-link" id="home-link">
                        <img src="https://avatars.githubusercontent.com/u/53030585?v=4" alt="" class="icon-sm" />
                        CKAY9.dev
                    </a>
                    <h1>Projects</h1>
                </header>

                <div class="slider" id="slider">
                    <div class="slider-track">
                        <!-- Panel 1: grid -->
                        <div class="slider-panel" id="grid-panel">
                            <div class="project-grid" id="project-grid"></div>
                        </div>

                        <!-- Panel 2: detail -->
                        <div class="slider-panel" id="detail-panel" inert>
                            <button class="back-btn" id="back-btn">&larr; All projects</button>
                            <div id="project-detail"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>

</html>
