<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projects | CKAY9.dev</title>
    <meta name="description" content="Projects by Cameron Armstrong (CKAY9): games, plugins, and web tools." />
    <link rel="icon" type="image/x-icon" href="https://avatars.githubusercontent.com/u/53030585?v=4" />
    <link rel="stylesheet" href="./styles.css" />
</head>

<body class="dark">
    <div class="container wide">
        <section class="content">
            <header class="projects-header">
                <a href="./index.html" class="home-link">
                    <img src="https://avatars.githubusercontent.com/u/53030585?v=4" alt="" class="icon-sm" />
                    CKAY9.dev
                </a>
                <h1>Projects</h1>
            </header>

            <div class="slider" id="slider">
                <div class="slider-track">
                    <!-- Panel 1: grid -->
                    <div class="slider-panel" id="grid-panel">
                        <div class="project-grid" id="project-grid"></div>
                    </div>

                    <!-- Panel 2: detail -->
                    <div class="slider-panel" id="detail-panel" inert>
                        <button class="back-btn" id="back-btn">&larr; All projects</button>
                        <div id="project-detail"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const projects = [
            {
                id: "village",
                name: "Village",
                tagline: "A Werewolf inspired deduction gamemode in Minecraft.",
                description: "Village follows a very similar flow to Among Us. Players will move around, do tasks, etc. until either a body is found or a meeting is called. Once a meeting is called, players will be teleported to the meeting teleport to discuss (I recommend using Discord for voice, but chat works fine). They are able to evict a player by majority vote, or just go onto the next day.",
                tags: ["Plugin", "Minecraft", "Java"],
                links: [
                    { label: "GitHub", url: "https://github.com/CKAY-9/village" },
                    { label: "Spigot", url: "https://www.spigotmc.org/resources/village.130487" }
                ],
                thumbnail: "https://camo.githubusercontent.com/b9b0af144363ad77dba9dc6e25a043623ee296c79c45a88e4a2f3e72751c469b/68747470733a2f2f692e696d6775722e636f6d2f746c5367364e552e706e67",
                images: [
                    "https://camo.githubusercontent.com/c4442f7f83f61c63effada6ded27a7a24c75278b9f3d2aa110af1a3c4ff32238/68747470733a2f2f692e696d6775722e636f6d2f333542435151412e706e67",
                    "https://camo.githubusercontent.com/d4fa97c3f3e5b8d1228b9f089032c270edb3a4e034c4b0d5feef7fce38c3e78a/68747470733a2f2f692e696d6775722e636f6d2f35537676544b472e706e67"
                ]
            },
            {
                id: "k9r",
                name: "K9R",
                tagline: "An absolute overhaul to K9-Forums. K9-Revive.",
                description: "K9-Revive (K9R) is a spiritual successor to my previous project K9-Forums. K9-Forums was, as I decided with many other projects, poorly structured, not what I would want to have out there, and not complete. K9R is ultimately my first major revision of one of projects, with more likely to come (they have been deleted off of GitHub), and will hopefully be great; however, K9-Forums will remain on GitHub as it is in a \"usable\" state and as a look back into my coding history.",
                tags: ["Web", "TypeScript"],
                links: [
                    { label: "GitHub", url: "https://github.com/CKAY-9/k9r" }
                ],
                thumbnail: "https://github.com/CKAY-9/k9r/raw/main/assets/showcase/site_home.png",
                images: [
                    "https://github.com/CKAY-9/k9r/raw/main/assets/showcase/site_home.png", 
                    "https://github.com/CKAY-9/k9r/raw/main/assets/showcase/game_integration.png"
                ]
            },
            {
                id: "mushroommania",
                name: "Mushroom Mania",
                tagline: "An interactive cultivation addon for Garry's Mod DarkRP.",
                description: "A mushroom cultivation mechanic for DarkRP. Prepare a MonoTub, grow one of five strains, keep it misted and filtered, then dry your harvest and sell it to a Mushroom Enthusiast.",
                tags: ["Garry's Mod", "Lua"],
                links: [
                    { label: "GitHub", url: "https://github.com/CKAY-9/mushroommania" },
                    { label: "Steam Workshop", url: "https://steamcommunity.com/sharedfiles/filedetails/?id=3835560405" }
                ],
                thumbnail: "https://images.steamusercontent.com/ugc/13534250992317156792/A1B8D79062983BA5914ECA3D7734F3FF61845E60/?imw=5000&imh=5000&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=false",
                // Optional. YouTube link (watch / youtu.be / shorts) or a direct video file (.mp4, .webm)
                showcaseVideo: "https://www.youtube.com/watch?v=LbOlZ-hnKLc",
                images: [
                    "https://images.steamusercontent.com/ugc/15011373583952941683/19707ACF1036BDFF76FBA3146F71C3FC9739CBB2/?imw=5000&imh=5000&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=false", 
                    "https://images.steamusercontent.com/ugc/16162663311962553474/2F0DDE4E9123C957E199F8FC1D0765520D99C7B1/?imw=5000&imh=5000&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=false"
                ]
            }
        ];

        const slider = document.getElementById("slider");
        const gridPanel = document.getElementById("grid-panel");
        const detailPanel = document.getElementById("detail-panel");
        const grid = document.getElementById("project-grid");
        const detail = document.getElementById("project-detail");
        const backBtn = document.getElementById("back-btn");

        function media(src, alt, label) {
            return src
                ? `<img src="${src}" alt="${alt}" loading="lazy" />`
                : `<div class="placeholder">${label}</div>`;
        }

        function youtubeId(url) {
            const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
            return m ? m[1] : null;
        }

        function video(src, title) {
            const yt = youtubeId(src);
            return yt
                ? `<iframe src="https://www.youtube-nocookie.com/embed/${yt}" title="${title}" loading="lazy"
                       referrerpolicy="strict-origin-when-cross-origin"
                       allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>`
                : `<video src="${src}" controls preload="metadata" playsinline></video>`;
        }

        function initials(name) {
            return name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
        }

        // Render grid
        grid.innerHTML = projects.map(p => `
            <button class="project-card" data-id="${p.id}">
                <div class="project-thumb">${media(p.thumbnail, p.name, initials(p.name))}</div>
                <div class="project-card-body">
                    <h3>${p.name}</h3>
                    <p>${p.tagline}</p>
                    <div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
                </div>
            </button>
        `).join("");

        grid.addEventListener("click", e => {
            const card = e.target.closest(".project-card");
            if (!card) return;
            history.pushState({ fromGrid: true }, "", "#" + card.dataset.id);
            route();
        });

        function renderDetail(p) {
            detail.innerHTML = `
                <div class="detail-header">
                    <h2>${p.name}</h2>
                    <div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
                    <p class="detail-desc">${p.description}</p>
                    <div class="detail-links">
                        ${p.links.map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label} &nearr;</a>`).join("")}
                    </div>
                </div>
                ${p.showcaseVideo ? `<figure class="showcase-video">${video(p.showcaseVideo, `${p.name} showcase video`)}</figure>` : ""}
                <div class="gallery">
                    ${p.images.map((src, i) => `<figure>${media(src, `${p.name} screenshot ${i + 1}`, "Screenshot")}</figure>`).join("")}
                </div>
            `;
        }

        function route() {
            const id = location.hash.slice(1);
            const project = projects.find(p => p.id === id);

            if (project) {
                renderDetail(project);
                slider.classList.add("open");
                gridPanel.inert = true;
                detailPanel.inert = false;
                backBtn.focus({ preventScroll: true });
            } else {
                slider.classList.remove("open");
                gridPanel.inert = false;
                detailPanel.inert = true;
                // Clear the detail once it has slid away so any playing video stops
                setTimeout(() => {
                    if (!slider.classList.contains("open")) detail.innerHTML = "";
                }, 500);
            }
            syncHeight();
        }

        function goBack() {
            if (history.state && history.state.fromGrid) {
                history.back();
            } else {
                history.replaceState(null, "", location.pathname);
                route();
            }
        }

        // Keep the slider as tall as whichever panel is showing
        function syncHeight() {
            const active = slider.classList.contains("open") ? detailPanel : gridPanel;
            slider.style.height = active.offsetHeight + "px";
        }
        new ResizeObserver(syncHeight).observe(gridPanel);
        new ResizeObserver(syncHeight).observe(detailPanel);

        backBtn.addEventListener("click", goBack);
        window.addEventListener("popstate", route);
        document.addEventListener("keydown", e => {
            if (e.key === "Escape" && slider.classList.contains("open")) goBack();
        });

        route();
    </script>
</body>

</html>
