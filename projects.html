<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projects | CKAY9.dev</title>
    <meta name="description" content="Projects by Cameron Armstrong (CKAY9): games, plugins, and web tools." />
    <link rel="icon" type="image/x-icon" href="https://avatars.githubusercontent.com/u/53030585?v=4" />
    <link rel="stylesheet" href="./styles.css" />
</head>

<body class="dark">
    <!-- Two layers so switching between projects crossfades instead of swapping -->
    <div class="bg-tiles" aria-hidden="true"><div class="bg-tiles-pan"></div></div>
    <div class="bg-tiles" aria-hidden="true"><div class="bg-tiles-pan"></div></div>

    <div class="container wide">
        <section class="content">
            <header class="projects-header">
                <a href="./index.html" class="home-link">
                    <img src="https://avatars.githubusercontent.com/u/53030585?v=4" alt="" class="icon-sm" />
                    CKAY9.dev
                </a>
                <h1>Projects</h1>
            </header>

            <div class="slider" id="slider">
                <div class="slider-track">
                    <!-- Panel 1: grid -->
                    <div class="slider-panel" id="grid-panel">
                        <div class="project-grid" id="project-grid"></div>
                    </div>

                    <!-- Panel 2: detail -->
                    <div class="slider-panel" id="detail-panel" inert>
                        <button class="back-btn" id="back-btn">&larr; All projects</button>
                        <div id="project-detail"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const projects = [
            {
                id: "gnet",
                icon: "/assets/garrynet/logo.svg", // Icon image URL
                name: "GarryNet",
                tagline: "Unify your Garry's Mod Community.",
                description: "An all-in-one, self-hosted website for Garry's Mod communities: forums, a store, support tickets, loading screens and live server sync, all in one deployment.",
                tags: ["Garry's Mod", "Web"],
                links: [
                    { label: "GitHub", url: "https://github.com/CKAY-9/garrynet" },
                ],
                thumbnail: "/assets/garrynet/home.png",
                // Optional. YouTube link (watch / youtu.be / shorts) or a direct video file (.mp4, .webm)
                images: [
                    "/assets/garrynet/store.png",
                    "/assets/garrynet/admin-usergroups.png"
                ]
            },
            {
                id: "bmod",
                icon: "/assets/bmod/icon.png", // Icon image URL
                name: "BMod",
                tagline: "Blender-To-Garry's Mod Tool.",
                description: "Blender-to-Garry's Mod, or BMod, is a simple GUI app for converting modern model files and an unwrapped texture into a Garry's Mod static prop: .mdl plus .vtf/.vmt.",
                tags: ["Garry's Mod", "Rust"],
                links: [
                    { label: "GitHub", url: "https://github.com/CKAY-9/bmod" },
                ],
                thumbnail: "/assets/bmod/top.png",
                // Optional. YouTube link (watch / youtu.be / shorts) or a direct video file (.mp4, .webm)
                images: [
                    "/assets/bmod/export.png",
                    "/assets/bmod/settings.png"
                ]
            },
            {
                id: "village",
                icon: "/assets/village/icon.png", // Icon image URL
                name: "Village",
                tagline: "A Werewolf inspired deduction gamemode in Minecraft.",
                description: "Village follows a very similar flow to Among Us. Players will move around, do tasks, etc. until either a body is found or a meeting is called. Once a meeting is called, players will be teleported to the meeting teleport to discuss (I recommend using Discord for voice, but chat works fine). They are able to evict a player by majority vote, or just go onto the next day.",
                tags: ["Minecraft", "Java"],
                links: [
                    { label: "GitHub", url: "https://github.com/CKAY-9/village" },
                    { label: "Spigot", url: "https://www.spigotmc.org/resources/village.130487" }
                ],
                thumbnail: "/assets/village/villager.png",
                images: [
                    "/assets/village/reactor.png",
                    "/assets/village/sabotage.png"
                ]
            },
            {
                id: "cxtokens",
                icon: "/assets/cxtokens/icon.png", // Icon image URL
                name: "CxTokens",
                tagline: "A full economy system for Spigot/Paper Minecraft servers.",
                description: "CxTokens adds a complete token-based economy to Spigot/Paper servers. Players can buy and sell items in a configurable store, bid against each other in a live auction house, place bounties on rivals, store money in physical vaults, share balances through PIN-protected token accounts, and take their chances in timed lotteries. Nearly every feature can be tweaked or disabled through config files.",
                tags: ["Minecraft", "Java"],
                links: [
                    { label: "GitHub", url: "https://github.com/CKAY-9/CxTokens" },
                    { label: "Spigot", url: "https://www.spigotmc.org/resources/cxtokens.115789/" }
                ],
                thumbnail: "/assets/cxtokens/store.png",
                images: [
                    "/assets/cxtokens/auction.png",
                    "/assets/cxtokens/vault.png"
                ]
            },
            {
                id: "mushroommania",
                icon: "/assets/mushroommania/icon.png", // Icon image URL
                name: "Mushroom Mania",
                tagline: "An interactive cultivation addon for Garry's Mod DarkRP.",
                description: "A mushroom cultivation mechanic for DarkRP. Prepare a MonoTub, grow one of five strains, keep it misted and filtered, then dry your harvest and sell it to a Mushroom Enthusiast.",
                tags: ["Garry's Mod", "Lua"],
                links: [
                    { label: "GitHub", url: "https://github.com/CKAY-9/mushroommania" },
                    { label: "Steam Workshop", url: "https://steamcommunity.com/sharedfiles/filedetails/?id=3835560405" }
                ],
                thumbnail: "/assets/mushroommania/showcase.jpg",
                // Optional. YouTube link (watch / youtu.be / shorts) or a direct video file (.mp4, .webm)
                showcaseVideo: "https://www.youtube.com/watch?v=LbOlZ-hnKLc",
                images: [
                    "/assets/mushroommania/enthusiast.jpg",
                    "/assets/mushroommania/shelf.jpg"
                ]
            },
        ];

        const slider = document.getElementById("slider");
        const gridPanel = document.getElementById("grid-panel");
        const detailPanel = document.getElementById("detail-panel");
        const grid = document.getElementById("project-grid");
        const detail = document.getElementById("project-detail");
        const backBtn = document.getElementById("back-btn");

        function media(src, alt, label) {
            return src
                ? `<img src="${src}" alt="${alt}" loading="lazy" />`
                : `<div class="placeholder">${label}</div>`;
        }

        function youtubeId(url) {
            const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
            return m ? m[1] : null;
        }

        function video(src, title) {
            const yt = youtubeId(src);
            return yt
                ? `<iframe src="https://www.youtube-nocookie.com/embed/${yt}" title="${title}" loading="lazy"
                       referrerpolicy="strict-origin-when-cross-origin"
                       allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>`
                : `<video src="${src}" controls preload="metadata" playsinline></video>`;
        }

        function icon(p, cls) {
            return p.icon ? `<img class="project-icon ${cls}" src="${p.icon}" alt="" />` : "";
        }

        function initials(name) {
            return name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
        }

        // Render grid
        grid.innerHTML = projects.map(p => `
            <button class="project-card" data-id="${p.id}">
                <div class="project-thumb">${media(p.thumbnail, p.name, initials(p.name))}</div>
                <div class="project-card-body">
                    <h3 class="name-row">${icon(p, "sm")}<span>${p.name}</span></h3>
                    <p>${p.tagline}</p>
                    <div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
                </div>
            </button>
        `).join("");

        grid.addEventListener("click", e => {
            const card = e.target.closest(".project-card");
            if (!card) return;
            history.pushState({ fromGrid: true }, "", "#" + card.dataset.id);
            route();
        });

        function renderDetail(p) {
            detail.innerHTML = `
                <div class="detail-header">
                    <h2 class="name-row">${icon(p, "lg")}<span>${p.name}</span></h2>
                    <div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
                    <p class="detail-desc">${p.description}</p>
                    <div class="detail-links">
                        ${p.links.map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label} &nearr;</a>`).join("")}
                    </div>
                </div>
                ${p.showcaseVideo ? `<figure class="showcase-video">${video(p.showcaseVideo, `${p.name} showcase video`)}</figure>` : ""}
                <div class="gallery">
                    ${p.images.map((src, i) => `<figure>${media(src, `${p.name} screenshot ${i + 1}`, "Screenshot")}</figure>`).join("")}
                </div>
            `;
        }

        function route() {
            const id = location.hash.slice(1);
            const project = projects.find(p => p.id === id);

            if (project) {
                renderDetail(project);
                slider.classList.add("open");
                gridPanel.inert = true;
                detailPanel.inert = false;
                backBtn.focus({ preventScroll: true });
            } else {
                slider.classList.remove("open");
                gridPanel.inert = false;
                detailPanel.inert = true;
                // Clear the detail once it has slid away so any playing video stops
                setTimeout(() => {
                    if (!slider.classList.contains("open")) detail.innerHTML = "";
                }, 500);
            }
            if (project) hoverId = null;
            updateBg();
            syncHeight();
        }

        function goBack() {
            if (history.state && history.state.fromGrid) {
                history.back();
            } else {
                history.replaceState(null, "", location.pathname);
                route();
            }
        }

        // Keep the slider as tall as whichever panel is showing
        function syncHeight() {
            const active = slider.classList.contains("open") ? detailPanel : gridPanel;
            slider.style.height = active.offsetHeight + "px";
        }
        new ResizeObserver(syncHeight).observe(gridPanel);
        new ResizeObserver(syncHeight).observe(detailPanel);

        // ---------- Icon backdrop ----------
        const TILE = 160; // keep in sync with --tile in styles.css
        const ICON_SIZE = 36;
        const tileUrls = {};
        const bgLayers = [...document.querySelectorAll(".bg-tiles")];
        let bgActive = 0;
        let hoverId = null;
        let focusId = null;

        // Draw each icon into a padded, staggered tile once, so it repeats with breathing room
        function buildTile(p) {
            if (!p.icon) return;
            const img = new Image();
            img.onload = () => {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const c = document.createElement("canvas");
                c.width = c.height = TILE * dpr;
                const ctx = c.getContext("2d");
                ctx.scale(dpr, dpr);
                const w = img.naturalWidth || ICON_SIZE;
                const h = img.naturalHeight || ICON_SIZE;
                const s = ICON_SIZE / Math.max(w, h);
                for (const [x, y] of [[0.25, 0.25], [0.75, 0.75]]) {
                    ctx.save();
                    ctx.translate(x * TILE, y * TILE);
                    ctx.rotate(-0.2);
                    ctx.drawImage(img, -w * s / 2, -h * s / 2, w * s, h * s);
                    ctx.restore();
                }
                try {
                    tileUrls[p.id] = `url(${c.toDataURL()})`;
                    updateBg();
                } catch { /* tainted canvas: skip the backdrop for this one */ }
            };
            img.src = p.icon;
        }
        projects.forEach(buildTile);

        // ---------- Backdrop motion ----------
        // Velocity-based so the direction can change mid-flight without the pattern jumping.
        // Position wraps per tile, which is seamless because the pattern repeats per tile.
        const DRIFT_SPEED = 9;     // px/s, the slow constant drift
        const SURGE_DIST = TILE;   // extra px travelled during a transition
        const SURGE_MS = 1100;
        const FADE_MS = 800;       // keep moving while a layer fades out
        const bgPans = bgLayers.map(l => l.querySelector(".bg-tiles-pan"));
        const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
        const pos = { x: 0, y: 0 };
        let dir = { x: Math.SQRT1_2, y: Math.SQRT1_2 }; // drift direction, starts down-right
        let surge = null;          // { start, from, to } (unit vectors)
        let lastShown = 0;
        let lastFrame = 0;
        let frameReq = 0;

        // On each transition, pick a new direction at least 45 degrees away from the current one
        function startSurge() {
            if (reducedMotion.matches) return;
            const angle = Math.atan2(dir.y, dir.x) + Math.PI / 4 + Math.random() * Math.PI * 1.5;
            surge = { start: performance.now(), from: dir, to: { x: Math.cos(angle), y: Math.sin(angle) } };
            kickMotion();
        }

        function kickMotion() {
            if (frameReq || reducedMotion.matches) return;
            lastFrame = performance.now();
            frameReq = requestAnimationFrame(stepMotion);
        }

        function stepMotion(now) {
            const dt = Math.min(now - lastFrame, 50) / 1000;
            lastFrame = now;

            let vx = dir.x * DRIFT_SPEED;
            let vy = dir.y * DRIFT_SPEED;
            if (surge) {
                const u = Math.min((now - surge.start) / SURGE_MS, 1);
                // Drift velocity blends straight across to the new direction (no sweeping
                // rotation), plus a push along the new direction that swells and settles.
                const ease = u * u * (3 - 2 * u);
                const push = (SURGE_DIST * Math.PI / 2) / (SURGE_MS / 1000) * Math.sin(Math.PI * u);
                vx = (surge.from.x + (surge.to.x - surge.from.x) * ease) * DRIFT_SPEED + surge.to.x * push;
                vy = (surge.from.y + (surge.to.y - surge.from.y) * ease) * DRIFT_SPEED + surge.to.y * push;
                if (u >= 1) {
                    dir = surge.to;
                    surge = null;
                }
            }

            pos.x = (((pos.x + vx * dt) % TILE) + TILE) % TILE;
            pos.y = (((pos.y + vy * dt) % TILE) + TILE) % TILE;
            const t = `translate3d(${pos.x}px, ${pos.y}px, 0)`;
            bgPans.forEach(p => p.style.transform = t);

            if (bgLayers.some(l => l.classList.contains("peek") || l.classList.contains("open"))) lastShown = now;
            frameReq = (surge || now - lastShown < FADE_MS) ? requestAnimationFrame(stepMotion) : 0;
        }

        reducedMotion.addEventListener("change", () => {
            surge = null;
            if (reducedMotion.matches) {
                cancelAnimationFrame(frameReq);
                frameReq = 0;
            } else {
                kickMotion();
            }
        });

        function updateBg() {
            const openId = slider.classList.contains("open") ? location.hash.slice(1) : null;
            const id = openId || hoverId || focusId;
            const current = bgLayers[bgActive];
            const wasOpen = current.classList.contains("open");

            if (!id) {
                current.classList.remove("peek", "open");
                if (wasOpen) startSurge();
                return;
            }

            // Different project: fade the current layer out and bring the other one in.
            // Same project (e.g. re-hovering mid fade-out) keeps its layer and just fades back.
            if (current.dataset.id !== id) {
                current.classList.remove("peek", "open");
                bgActive ^= 1;
            }

            const layer = bgLayers[bgActive];
            layer.dataset.id = id;
            bgPans[bgActive].style.backgroundImage = tileUrls[id] || "";
            layer.classList.toggle("open", !!openId);
            layer.classList.toggle("peek", !openId);

            // Opening or closing a project swoops the backdrop into a new direction
            if (!!openId !== wasOpen) startSurge();
            kickMotion();
        }

        grid.addEventListener("pointerover", e => {
            if (e.pointerType === "touch") return;
            const card = e.target.closest(".project-card");
            hoverId = card ? card.dataset.id : null;
            updateBg();
        });
        grid.addEventListener("pointerout", e => {
            if (e.pointerType === "touch") return;
            if (e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(".project-card")) return;
            hoverId = null;
            updateBg();
        });
        grid.addEventListener("focusin", e => {
            const card = e.target.closest(".project-card");
            focusId = card && card.matches(":focus-visible") ? card.dataset.id : null;
            updateBg();
        });
        grid.addEventListener("focusout", () => {
            focusId = null;
            updateBg();
        });

        backBtn.addEventListener("click", goBack);
        window.addEventListener("popstate", route);
        document.addEventListener("keydown", e => {
            if (e.key === "Escape" && slider.classList.contains("open")) goBack();
        });

        route();
    </script>
</body>

</html>
